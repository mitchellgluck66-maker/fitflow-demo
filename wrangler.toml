# FitFlow - Cloudflare Pages Configuration
name = "fitflow-demo"
pages_build_output_dir = ".vercel/output"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding (for production)
# Update database_id after creating database in Cloudflare
[[d1_databases]]
binding = "DB"
database_name = "fitflow"
database_id = "00000000-0000-0000-0000-000000000000"  # Replace with your database ID

# Development Environment
[env.development]
name = "fitflow-dev"
build = { command = "npm run build" }
d1_databases = []

[env.development.vars]
ENVIRONMENT = "development"
TIMEZONE = "America/Denver"
APP_NAME = "FitFlow Dev"

# Production Environment
[env.production]
name = "fitflow-prod"
build = { command = "npm run build" }
d1_databases = [{binding = "DB", database_name = "fitflow"}]

[env.production.vars]
ENVIRONMENT = "production"
TIMEZONE = "America/New_York"
APP_NAME = "FitFlow"

# Analytics and Monitoring
[analytics]
enabled = true
