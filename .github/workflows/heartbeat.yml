# Cron heartbeat — FALLBACK (2026-09-30, Ingestion v2).
#
# Vercel Pro crons are the primary scheduler (vercel.json: sync-ghl hourly at :07, dispatch hourly at :37).
# GitHub scheduled runs are best-effort (this job fired 3 times in 9 overnight hours on 2026-09-29), so this
# workflow is only a fallback: every 6 hours it calls the same two routes with the X-FitFlow-Trigger header,
# which /api/sync/status reports as `via: github`. If Vercel's crons stop, the app's own scheduler-silent check
# (3 h without any scheduled run → critical incident + red banner) fires long before this runs again.
#
# Minutes: 4 runs/day × ~5 billed min ≈ 600 min/month (sync-ghl may use its full 200 s budget) + the nightly
# backup (~90) — well under GitHub Free's 2,000 for private repos.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL      production origin, e.g. https://fitflow.vercel.app (no path)
#   CRON_SECRET  the SAME value as Vercel's CRON_SECRET env var
#
# A non-2xx from either route fails the run (red X). The dispatch returns 500 only when a step failed or one was
# stuck 3 runs in a row; the log lists every step's outcome.
name: Cron heartbeat

on:
  schedule:
    # Every 6 hours at :17 — a fallback, off the Vercel crons (:07 / :37). Late starts are fine.
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cron-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # sync-ghl may use its full 200 s budget, dispatch ~110 s + one step: cap well above both.
    timeout-minutes: 12
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets are configured
        run: |
          missing=0
          [ -n "$APP_URL" ] || { echo "::error::Repo secret APP_URL is not set"; missing=1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repo secret CRON_SECRET is not set"; missing=1; }
          exit $missing

      - name: GET /api/cron/sync-ghl
        run: |
          set -uo pipefail
          code=$(curl -sS --max-time 290 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" -H "X-FitFlow-Trigger: github-heartbeat" "${APP_URL%/}/api/cron/sync-ghl") || code="curl-exit-$?"
          echo "HTTP $code"
          # Summary only — never dump the raw body into the log.
          jq -r '"ok=\(.ok) partial=\(.partial) phase=\(.phase) \(.skipped // .progress // "") \(.error // "")"' body.json 2>/dev/null || head -c 300 body.json 2>/dev/null || true
          case "$code" in 2??) ;; *) echo "::error::sync-ghl returned $code"; exit 1 ;; esac

      - name: GET /api/cron/dispatch
        # Runs even when sync-ghl failed: the dispatch isolates its own steps.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          code=$(curl -sS --max-time 290 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" -H "X-FitFlow-Trigger: github-heartbeat" "${APP_URL%/}/api/cron/dispatch") || code="curl-exit-$?"
          echo "HTTP $code"
          # 200 = healthy (partial=true only means some steps were deferred to the next run and go first there).
          # 500 = a step FAILED, or one was stuck (timed out / deferred 3 runs in a row) — see failed / stuck.
          jq -r '"ok=\(.ok) partial=\(.partial) localHour=\(.localHour) \(.durationMs)ms",
                 (if (.failed // []) | length > 0 then "FAILED: \(.failed | map(.name + " (" + .error + ")") | join(", "))" else empty end),
                 (if (.stuck // []) | length > 0 then "STUCK: \(.stuck | map(.name + " ×" + (.count|tostring) + " " + .as) | join(", "))" else empty end),
                 ((.order // [])[] as $k | "  \($k): \(.steps[$k].status) \(.steps[$k].reason // .steps[$k].error // "")")' body.json 2>/dev/null || head -c 300 body.json 2>/dev/null || true
          case "$code" in 2??) ;; *) echo "::error::dispatch returned $code"; exit 1 ;; esac
